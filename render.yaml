# Render Blueprint for the SentryPrompt4 backend (NFR-004: container-based
# deployment path). Create a new Blueprint instance from this repo in the
# Render dashboard; it reads this file automatically.
#
# Every entry marked `sync: false` holds a secret or deployment-specific
# value and is deliberately left out of this file. Render will prompt for
# it once in the dashboard when the service is first created; fill it in
# there, never by editing this file. See DEPLOYMENT.md for the full list
# and where each value comes from.

services:
  - type: web
    name: sentryprompt-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # The deployed frontend's exact origin (https://..., no trailing
      # slash). Must be filled in after the frontend's first Vercel deploy.
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_REQUEST_BYTES
        value: "65536"

      # ---- Database (Supabase) -------------------------------------------
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: SUPABASE_URL
        value: https://dduqmzlxpglfblusgdsa.supabase.co

      # ---- Login (Supabase Auth) -----------------------------------------
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      # ---- Chat ------------------------------------------------------------
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false
      - key: CHAT_HISTORY_LIMIT
        value: "20"
      - key: CHAT_REPLY_TIMEOUT_SECONDS
        value: "30"

      # ---- LLM (Groq by default) -------------------------------------------
      - key: LLM_PROVIDER
        value: groq
      - key: CONTEXT_DETECTOR_TIMEOUT_SECONDS
        value: "3"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      # ---- Rate limits -------------------------------------------------------
      - key: SCREENING_RATE_LIMIT_PER_CLIENT
        value: "10"
      - key: SCREENING_RATE_LIMIT_GLOBAL
        value: "25"
      - key: AUTH_RATE_LIMIT_PER_CLIENT
        value: "60"
      - key: PROFILE_RATE_LIMIT_PER_USER
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
