name: Frontend checks

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (includes the no-HTML-from-strings rules)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build (adds the Content-Security-Policy)
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid
          VITE_SUPABASE_URL: https://project.supabase.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=low
