name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies (Python 3.11, the minimum supported)
        run: uv sync --locked --python 3.11

      - name: Lint (includes Bandit security rules)
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Dependency vulnerability audit
        run: uv run pip-audit --progress-spinner off
