name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway PostgreSQL for the integration and schema-security tests.
    # The password is for this disposable CI container only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Install locked dependencies (Python 3.11, the minimum supported)
        run: uv sync --locked --python 3.11

      - name: Lint (includes Bandit security rules)
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (including PostgreSQL integration and schema-security tests)
        run: uv run pytest

      - name: Dependency vulnerability audit
        run: uv run pip-audit --progress-spinner off
